of the senator of Rome against the Accademia di San Luca, declaring that the time limit for payment of the rent owed is not expired. Also, the Accademia di San Luca petitions the civil court of the senator of Rome, represented by its \u003cem\u003ecamerario\u003c/em\u003e [treasurer] Pier Francesco Rossi, against Francesco de Corneli, accepting Cornelis’s request of taking the \u003cem\u003eiuramentum de calumnia\u003c/em\u003e [oath of slander].\u003c/p\u003e\u003cp\u003e\u003c/p\u003e\u003cp\u003e[Italian version]\u003c/p\u003e\u003cp\u003eErcole Bertolucci ricorre presso il tribunale civile del senatore di Roma contro l’Accademia di San Luca, dichiarando di essere disposto a pagare i 10 scudi dovuti per i mesi arretrati di affitto, ma chiedendo che venga nominato un notaio che si impegni a calcolare nuovamente la cifra totale dovuta e a controllare che l’Accademia, proprietaria della casa, si impegni a una ristrutturazione della stessa.\u0026nbsp;Santi Ghetti ricorre presso il tribunale civile del senatore di Roma contro l’Accademia di San Luca, dichiarando non essere ancora scaduto il termine entro il quale pagare l’affitto dovuto. Inoltre, l’Accademia di San Luca ricorre presso il tribunale civile del senatore di Roma, assistita dal proprio \u003cem\u003ecamerario \u003c/em\u003e[tesoriere] Pier Francesco Rossi, contro Francesco de Corneliis, accettando la richiesta della controparte di prestare \u003cem\u003eiuramentum de calumnia\u003c/em\u003e [giuramento di calunnia].\u003c/p\u003e"}}]}]},{"id":"https://MultimedialitySummerSchool.github.io/NotarialDocuments2/iiif/asrtcsvol054416280411b/canvas/2","type":"Canvas","height":3396,"width":2295,"label":{"none":["ASR_TCS_vol544_1628_fol396V"]},"thumbnail":[{"id":"https://MultimedialitySummerSchool.github.io/NotarialDocuments2/iiif/asrtcsvol054416280411b/043b23128eb2c6b877fbc9f49547a149/full/202,300/0/default.jpg","type":"Image","format":"image/jpeg","height":300,"width":202}],"items":[{"id":"https://MultimedialityS
